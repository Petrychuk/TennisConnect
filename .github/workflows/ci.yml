name: CI

# Runs on every push and PR - the point of this workflow existing at
# all is that a security regression (or a plain type error) gets
# caught here, before merge, instead of being noticed in production.
# See the security audit this came out of: "Security Testing in CI"
# was a flat gap - there was no .github/ directory before this file.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # Playwright environment guard (TEST_ENV / BASE_URL / /api/health /
      # Production allowlist). No browser, no network, no database.
      - run: npm run test:e2e:guard
      # /api/test-hooks security (environment gate, shared secret,
      # test-data ownership). In-memory fakes - no database, no network.
      - run: npm run test:test-hooks

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails the build on high/critical advisories - moderate/low
      # ones are reported but don't block, since those are common
      # enough in transitive deps that blocking on every one of them
      # would make this check something people learn to ignore.
      - run: npm audit --audit-level=high

  
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo \
            --redact \
            --verbose \
            --exit-code 1

  # ---------------------------------------------------------------------
  # E2E / security regression tests (Playwright).
  #
  # NOT verified end-to-end in this environment - there was no CI setup
  # at all before this file, so this job is a best-effort starting
  # point, not a proven-working pipeline. Before trusting it:
  #   1. Add repo secrets: DATABASE_URL (a real, disposable TEST
  #      database - never point this at production or staging data),
  #      SESSION_SECRET, and any other env vars server/env.ts requires
  #      at boot (check that file for the full required list).
  #   2. Confirm `npm run db:push` against that DATABASE_URL actually
  #      produces a schema the app can run against from a clean slate.
  #   3. Confirm the server actually becomes reachable at
  #      http://localhost:5000 after `npm run dev` (check server/
  #      index.ts for the real port if this doesn't match) - the sleep
  #      below is a crude fixed wait, not a real readiness check.
  #   4. Run this job once and read its actual output before trusting
  #      green/red - a workflow that's never executed can look
  #      complete while quietly failing at step 1.
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck]

    env:
      DATABASE_URL: postgresql://tennisconnect_test:test_password@localhost:5432/tennisconnect_test
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      # Environment guard (tests/safety/environment-guard.ts): the run is
      # refused unless the server's GET /api/health reports a DB_ENV that
      # matches TEST_ENV. DB_ENV=test marks this throwaway Postgres.
      TEST_ENV: local
      BASE_URL: http://localhost:3000
      DB_ENV: test
      # Shared by the app server (checks the X-E2E-Test-Secret header) and
      # the Playwright helpers (send it). GitHub Actions secret; it is not
      # available to pull requests from forks, so hook-based tests fail
      # there by design.
      E2E_TEST_HOOK_SECRET: ${{ secrets.E2E_TEST_HOOK_SECRET }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tennisconnect_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tennisconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tennisconnect_test -d tennisconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Push schema to the test database
        run: npm run db:push

      - name: Start the app
        run: |
          nohup npm run dev > /tmp/tennisconnect-server.log 2>&1 &
          echo $! > /tmp/tennisconnect-server.pid
        env:
          NODE_ENV: development

      - name: Wait for the app to be ready
        run: |
          if ! npx wait-on http://localhost:3000 --timeout 60000; then
            echo "=== Server startup logs ==="
            cat /tmp/tennisconnect-server.log || true
            echo "=== Server process ==="
            ps aux | grep -E 'tsx|server/index' || true
            exit 1
          fi

      - name: Run smoke tests
        run: npx playwright test --grep @smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
