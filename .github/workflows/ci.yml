name: CI

# Runs on every push and PR - the point of this workflow existing at
# all is that a security regression (or a plain type error) gets
# caught here, before merge, instead of being noticed in production.
# See the security audit this came out of: "Security Testing in CI"
# was a flat gap - there was no .github/ directory before this file.
#
# Pull-request CI is self-contained: no Railway, no database, no secrets.
# Tests against the real Railway Staging environment live in the separate,
# manually triggered `staging-smoke` job below. Full E2E against Staging is
# not wired up yet - see docs/ci-staging-e2e.md for the planned design.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: >-
          Full 40-character commit SHA Railway Staging must be running.
          Leave empty to use the commit of the selected branch (normally main).
        required: false
        default: ''
      wait_minutes:
        description: Minutes to wait for Railway to finish deploying that commit (0-30).
        required: false
        default: '10'

# Least privilege for every job: read the repository, nothing else.
permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # Button system / header / accessibility guards and retreat
      # archive + ordering rules. Source files only - no browser, no network.
      - run: npm run test:ui

  dependency-audit:
    name: Dependency vulnerability scan
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails the build on high/critical advisories - moderate/low
      # ones are reported but don't block, since those are common
      # enough in transitive deps that blocking on every one of them
      # would make this check something people learn to ignore.
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo \
            --redact \
            --verbose \
            --exit-code 1

  e2e-guard:
    name: Playwright environment guard
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # TEST_ENV / BASE_URL / /api/health checks, Production allowlist,
      # deployed-commit verification and the staging smoke selection.
      # Uses `playwright test --list` only: no browser, no network.
      - run: npm run test:e2e:guard

  test-hooks-security:
    name: Test-hooks security
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # /api/test-hooks environment gate, shared secret and test-data
      # ownership. In-memory fakes - no database, no network, no secrets.
      - run: npm run test:test-hooks
      # Staging email capture (Production always delivers), response-body
      # log redaction and Stripe test-mode guards. Fake Resend, no network,
      # no secrets.
      - run: npm run test:staging-safety
      # Stage 2 E2E fixtures: identities, run tokens, deterministic fixture
      # data, the Staging-only seed gate and the seeder against an in-memory
      # store. No database, no credentials, no network - nothing is seeded.
      - run: npm run test:staging-fixtures
      # Stage 3: organisation/user cascade coverage against the schema,
      # Staging-only rate-limit exemption (real express-rate-limit), run
      # cleanup client/CLI/teardown. No database, no network, no secrets.
      - run: npm run test:cleanup

  db-integration:
    name: Database integration (throwaway Postgres)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A disposable postgres:16 container on the runner - never Staging or
    # Production (server/test-support/pgTestDb.ts refuses any non-loopback
    # host). Tables come from shared/schema.ts; each test file uses its own
    # schema and drops it afterwards.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tc_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/tc_it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Organisation deletion (seasons, series, templates, session updates)
      # and the run-scoped E2E cleanup against real foreign keys.
      - run: npm run test:db-integration

  # ---------------------------------------------------------------------
  # Read-only smoke tests against the REAL Railway Staging environment.
  #
  # Manual only (Actions -> CI -> Run workflow). Never runs for pull
  # requests, so untrusted code never reaches Staging, and it uses no
  # secrets at all: the selected tests are public, guest-only pages.
  #
  # Fails closed, in order:
  #   1. expected commit must be a full SHA that is on main (Railway
  #      Staging only deploys main);
  #   2. Staging's /api/health must report dbEnv=staging AND exactly that
  #      commit (waits up to wait_minutes for Railway to finish deploying);
  #   3. Playwright's own guard re-checks BASE_URL, dbEnv and the commit.
  # There is no Production fallback anywhere: BASE_URL is fixed below and
  # the guard rejects Production hosts for TEST_ENV=staging.
  # ---------------------------------------------------------------------
  staging-smoke:
    name: Staging smoke (Railway, read-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: staging-smoke
      cancel-in-progress: false

    env:
      TEST_ENV: staging
      BASE_URL: https://tennisconnect-staging.up.railway.app

    steps:
      - name: Resolve expected Staging commit
        id: expected
        env:
          # Passed via env, never interpolated into the script (injection-safe).
          INPUT_SHA: ${{ inputs.expected_sha }}
          REF_SHA: ${{ github.sha }}
        run: |
          sha="${INPUT_SHA:-$REF_SHA}"
          sha="$(printf '%s' "$sha" | tr 'A-F' 'a-f' | tr -d '[:space:]')"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Expected Railway Staging commit: $sha"

      # Test code from the same commit Staging should be running.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.expected.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Expected commit must be on main
        env:
          SHA: ${{ steps.expected.outputs.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main. Railway Staging deploys only from main, so it can never be running this commit."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify Staging runs the expected commit (dbEnv=staging)
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.expected.outputs.sha }}
          DEPLOY_WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: npm run e2e:verify-staging-deploy

      - run: npx playwright install --with-deps chromium

      - name: Run selected read-only smoke tests
        env:
          # Re-checked by tests/global-setup.ts before any test runs.
          EXPECTED_DEPLOY_SHA: ${{ steps.expected.outputs.sha }}
        run: npm run test:e2e:staging:smoke:ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-smoke-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
