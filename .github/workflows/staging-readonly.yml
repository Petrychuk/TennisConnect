name: Staging read-only E2E

# Manually triggered only (Actions -> "Staging read-only E2E" -> Run workflow).
# Never runs for pushes or pull requests, so untrusted code never reaches
# Staging, and it uses no secrets: every selected test is guest-only and
# read-only (tests/safety/staging-readonly.ts - 32 tests, the reviewed
# read-only set minus the 4 already run by CI's staging-smoke job).
#
# Fails closed, in order:
#   1. expected commit must be a full SHA that is on main (Railway Staging
#      only deploys main);
#   2. Staging's /api/health must report dbEnv=staging AND exactly that
#      commit (waits up to wait_minutes for Railway to finish deploying);
#   3. Playwright's own guard re-checks BASE_URL, dbEnv and the commit.
# There is no Production fallback anywhere: BASE_URL is fixed below and the
# guard rejects Production hosts for TEST_ENV=staging.
#
# One worker, no retries, HTML report uploaded as an artifact - all fixed
# in tests/safety/staging-readonly.ts, not here.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: >-
          Full 40-character commit SHA Railway Staging must be running.
          Leave empty to use the commit of the selected branch (normally main).
        required: false
        default: ''
      wait_minutes:
        description: Minutes to wait for Railway to finish deploying that commit (0-30).
        required: false
        default: '10'

permissions:
  contents: read

jobs:
  staging-readonly:
    name: Staging read-only E2E (Railway)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shares the staging-smoke group so the two never hit Staging at once.
    concurrency:
      group: staging-smoke
      cancel-in-progress: false

    env:
      TEST_ENV: staging
      BASE_URL: https://tennisconnect-staging.up.railway.app

    steps:
      - name: Resolve expected Staging commit
        id: expected
        env:
          # Passed via env, never interpolated into the script (injection-safe).
          INPUT_SHA: ${{ inputs.expected_sha }}
          REF_SHA: ${{ github.sha }}
        run: |
          sha="${INPUT_SHA:-$REF_SHA}"
          sha="$(printf '%s' "$sha" | tr 'A-F' 'a-f' | tr -d '[:space:]')"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Expected Railway Staging commit: $sha"

      # Test code from the same commit Staging should be running.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.expected.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Expected commit must be on main
        env:
          SHA: ${{ steps.expected.outputs.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main. Railway Staging deploys only from main, so it can never be running this commit."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify Staging runs the expected commit (dbEnv=staging)
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.expected.outputs.sha }}
          DEPLOY_WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: npm run e2e:verify-staging-deploy

      - run: npx playwright install --with-deps chromium

      - name: Run read-only Staging tests (1 worker, no retries)
        env:
          # Re-checked by tests/global-setup.ts before any test runs.
          EXPECTED_DEPLOY_SHA: ${{ steps.expected.outputs.sha }}
        run: npm run test:e2e:staging:readonly:ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-readonly-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
