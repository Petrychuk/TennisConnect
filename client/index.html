<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Preload the homepage hero photo (the LCP element there) as early
         as possible - before the JS bundle has even downloaded, let alone
         parsed/executed/rendered the <img> tag that requests it. That gap
         is most of where LCP time goes on a client-rendered SPA: without
         this, the browser can't start fetching the image until React has
         mounted and rendered Home, which on a slow connection can be
         seconds after the HTML itself arrives. Scoped to "/" only (via a
         tiny synchronous script, not a static <link>) so it doesn't also
         fire - and trigger a "was preloaded but not used" console warning -
         on every other page, which all share this one HTML shell. -->
    <script>
      if (location.pathname === "/") {
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.href = "/assets/images/tennis_main.jpg";
        l.fetchPriority = "high";
        document.head.appendChild(l);
      }
    </script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PB33Q552C9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'functionality_storage': 'denied',
        'personalization_storage': 'denied',
        'security_storage': 'granted'
      });

      gtag('config', 'G-PB33Q552C9');
    </script>
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#DFFF00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="manifest" href="/favicons/site.webmanifest">
    <link rel="icon" href="/favicons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Syne for headers (modern, fashionable), Inter for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Pure HTML/CSS placeholder, shown for the brief window between the
         browser having this markup and the JS bundle finishing download +
         parse + React mounting. Without this the person sees a fully
         blank white page during that gap - React's root.render() below
         replaces everything inside #root the instant it mounts, so this
         never lingers or conflicts with anything. -->
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;">
        <div style="width:40px;height:40px;border:3px solid #e5e5e5;border-top-color:#a3e635;border-radius:50%;animation:tc-boot-spin 0.8s linear infinite;"></div>
      </div>
    </div>
    <style>@keyframes tc-boot-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
