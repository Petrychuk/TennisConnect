<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Preload the homepage hero photo (the LCP element there) as early
         as possible - before the JS bundle has even downloaded, let alone
         parsed/executed/rendered the <img> tag that requests it. That gap
         is most of where LCP time goes on a client-rendered SPA: without
         this, the browser can't start fetching the image until React has
         mounted and rendered Home, which on a slow connection can be
         seconds after the HTML itself arrives. Scoped to "/" only (via a
         tiny synchronous script, not a static <link>) so it doesn't also
         fire - and trigger a "was preloaded but not used" console warning -
         on every other page, which all share this one HTML shell. -->
    <script>
      if (location.pathname === "/") {
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.href = "/assets/images/tennis_main.jpg";
        l.fetchPriority = "high";
        document.head.appendChild(l);
      } else if (location.pathname === "/travels" || location.pathname === "/clubs") {
        // Hero photo = LCP. Mobile gets the small file, desktop the original.
        var hn = location.pathname === "/clubs" ? "Dashboard_club" : "hurbord_tennis";
        [["/assets/images/" + hn + "-mobile.webp", "(max-width: 639px)"],
         ["/assets/images/" + hn + ".webp", "(min-width: 640px)"]].forEach(function (p) {
          var pl = document.createElement("link");
          pl.rel = "preload";
          pl.as = "image";
          pl.href = p[0];
          pl.media = p[1];
          pl.fetchPriority = "high";
          document.head.appendChild(pl);
        });
      } else if (location.pathname === "/play") {
        // Same two images /play preloads from React (Helmet) - but that runs
        // only after the JS bundle, too late to be the LCP request.
        [["/assets/images/play-hero-mobile.webp", "(max-width: 639px)"],
         ["/assets/images/play-hero-desktop.webp", "(min-width: 640px)"]].forEach(function (p) {
          var pl = document.createElement("link");
          pl.rel = "preload";
          pl.as = "image";
          pl.href = p[0];
          pl.media = p[1];
          pl.fetchPriority = "high";
          document.head.appendChild(pl);
        });
      }
    </script>
   <!-- Google Analytics + Consent Mode -->
    <script>
      // Playwright (and Puppeteer/Selenium) automated browsers set
      // navigator.webdriver = true - a standard W3C WebDriver property
      // the browser itself sets before any page script runs, not
      // something a test has to opt into or could forget to set. A
      // real visitor manually testing locally in an ordinary browser
      // has navigator.webdriver false/undefined and is unaffected.
      //
      // Skips gtag.js loading entirely for automated traffic, rather
      // than loading it and relying on Consent Mode/GA4 filtering to
      // exclude it afterwards - test runs against production (the
      // smoke suite's own ALLOW_PROD path) were showing up as real
      // GA4 users/sessions on pages like /coach/coach-playwright.
      //
      // tests/support/back-the-rally.spec.ts's own gtag spy tests
      // (SUPPORT-015/016) are unaffected: they install their own
      // window.gtag before clicking, regardless of whether this real
      // one ever existed, and the app's own call site
      // (BackTheRallyWidget.tsx) already calls it as
      // `window.gtag?.(...)` - a no-op, not an error, if gtag was
      // never defined.
      if (navigator.webdriver !== true) {
        window.dataLayer = window.dataLayer || [];

        function gtag() {
          dataLayer.push(arguments);
        }

        // Default: optional cookies are denied.
        var analyticsConsent = "denied";
        var marketingConsent = "denied";
        var preferencesConsent = "denied";

        // Restore the user's previously saved consent before GA4 starts.
        try {
          var storedConsent = localStorage.getItem("tennisconnect_cookie_consent");

          if (storedConsent) {
            var consent = JSON.parse(storedConsent);

            if (consent.version === 1) {
              analyticsConsent = consent.analytics ? "granted" : "denied";
              marketingConsent = consent.marketing ? "granted" : "denied";
              preferencesConsent = consent.preferences ? "granted" : "denied";
            }
          }
        } catch (e) {
          // If consent cannot be read, keep optional cookies denied.
        }

        gtag("consent", "default", {
          analytics_storage: analyticsConsent,
          ad_storage: marketingConsent,
          ad_user_data: marketingConsent,
          ad_personalization: marketingConsent,
          functionality_storage: preferencesConsent,
          personalization_storage: preferencesConsent,
          security_storage: "granted"
        });

        gtag("js", new Date());
        gtag("config", "G-PB33Q552C9");

        // Was a static <script src="...gtag/js?id=..."> tag - injected
        // dynamically instead so it's just as skippable by the same
        // check above as everything else in this block, rather than
        // always fetching regardless of what the check above decided.
        var gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src = "https://www.googletagmanager.com/gtag/js?id=G-PB33Q552C9";
        document.head.appendChild(gaScript);
      }
    </script>


    <!-- Additional SEO -->
    <meta name="theme-color" content="#DFFF00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="manifest" href="/favicons/site.webmanifest">
    <link rel="icon" href="/favicons/favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Syne for headers (modern, fashionable), Inter for UI -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap">
    <script>
      /* tc-fonts-v2: the stylesheet is added from script, NOT via an onload=""
         attribute - the site's CSP (helmet default script-src-attr 'none')
         blocks inline event handlers, which would leave the fonts unapplied. */
      (function () {
        var l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap";
        document.head.appendChild(l);
      })();
    </script>
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap"></noscript>
  </head>
  <body>
    <!-- Pure HTML/CSS placeholder, shown for the brief window between the
         browser having this markup and the JS bundle finishing download +
         parse + React mounting. Without this the person sees a fully
         blank white page during that gap - React's root.render() below
         replaces everything inside #root the instant it mounts, so this
         never lingers or conflicts with anything. -->
    <div id="root">
      <div style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#fff;">
        <div class="tcb-box"><img class="tcb-ball" src="/assets/images/tennis-ball.webp" width="56" height="56" alt=""><div class="tcb-shadow"></div></div>
      </div>
    </div>
    <style>body{margin:0}.tcb-box{--b:48px;position:relative;width:var(--b);height:calc(var(--b)*1.6)}@media (min-width:640px){.tcb-box{--b:64px}}@media (min-width:1024px){.tcb-box{--b:80px}}.tcb-ball{position:absolute;left:0;bottom:calc(var(--b)*.14);width:var(--b);height:var(--b);animation:tc-boot-bounce .85s ease-in-out infinite}.tcb-shadow{position:absolute;left:17.5%;bottom:calc(var(--b)*.03);width:65%;height:calc(var(--b)*.11);border-radius:50%;background:rgba(0,0,0,.2);filter:blur(2px);animation:tc-boot-shadow .85s ease-in-out infinite}@keyframes tc-boot-bounce{0%,100%{bottom:calc(var(--b)*.14);transform:scale(1.05,.95)}50%{bottom:calc(var(--b)*.57);transform:scale(1,1)}}@keyframes tc-boot-shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.5);opacity:.12}}@media (prefers-reduced-motion:reduce){.tcb-ball,.tcb-shadow{animation:none}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
